name: site-manager-theme-upgrade-acceptance

services:
  database:
    image: mariadb:11.4
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ci-fixture-root-only
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ci-fixture-pass-only
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 25

  wordpress:
    image: wordpress:php8.2-apache
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ci-fixture-pass-only
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('FS_METHOD', 'direct');
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - wordpress-data:/var/www/html

  cli:
    image: wordpress:cli-php8.2
    user: "33:33" # Match Debian Apache www-data to make shared WP volume writable.
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ci-fixture-pass-only
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress-data:/var/www/html
      - ../../dist:/artifacts:ro
    working_dir: /var/www/html

volumes:
  wordpress-data:
