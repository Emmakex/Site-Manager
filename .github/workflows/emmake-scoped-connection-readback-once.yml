name: Emmake scoped connection readback
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emmake-scoped-connection-readback-once.yml'
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    environment: site-manager-emmake-nuevaweb
    steps:
      - name: Verify saved WordPress connection scope without secrets
        env:
          SITE_MANAGER_REST_BASE: ${{ vars.SITE_MANAGER_REST_BASE }}
          SITE_MANAGER_MCP_TOKEN: ${{ secrets.SITE_MANAGER_MCP_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          base=os.environ["SITE_MANAGER_REST_BASE"]
          if not base.startswith("https://") or not base.endswith("/"):
              raise SystemExit("invalid_protected_rest_base")
          url=urllib.parse.urljoin(base,"connection")
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["SITE_MANAGER_MCP_TOKEN"],"Accept":"application/json","User-Agent":"emmake-scoped-readback/1"})
          with urllib.request.urlopen(req,timeout=20) as response:
              raw=response.read(100000)
          envelope=json.loads(raw)
          data=envelope.get("data",{})
          scopes=data.get("scopes",[])
          if not isinstance(scopes,list):
              raise SystemExit("invalid_scope_contract")
          print("SITE_CONNECTION_SCOPES_SAVED",len(scopes))
          print("THEME_PACKAGE_WRITE_SAVED", "theme.package.write" in scopes)
          print("SITE_READ_SAVED", "site.read" in scopes)
          PY
