name: Emmake Editorial Layout Diagnosis
on:
  pull_request:
    paths:
      - 'scripts/site_manager_emmake_editorial_layout.cjs'
      - '.github/workflows/emmake-editorial-layout.yml'
permissions:
  contents: read
jobs:
  public-read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact site and no-write script
        run: |
          node --check scripts/site_manager_emmake_editorial_layout.cjs
          grep -Fq "const ORIGIN = 'https://emmake.com/nuevaweb/'" scripts/site_manager_emmake_editorial_layout.cjs
          grep -Fq "form_submissions:0" scripts/site_manager_emmake_editorial_layout.cjs
      - name: Install pinned headless Chromium
        run: |
          npm install --prefix .qa-deps --ignore-scripts --no-audit --no-fund --no-save playwright@1.65.0
          .qa-deps/node_modules/.bin/playwright install chromium
      - name: Measure public editorial blocks (no writes)
        env:
          NODE_PATH: ${{ github.workspace }}/.qa-deps/node_modules
        run: node scripts/site_manager_emmake_editorial_layout.cjs
      - name: Keep short-lived evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmake-editorial-layout-diagnosis
          path: artifacts/emmake-editorial-layout/
          retention-days: 2
          if-no-files-found: warn
