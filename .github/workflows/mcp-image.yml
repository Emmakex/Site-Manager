name: Site Manager MCP Image

on:
  push:
    branches: [main]
    paths:
      - 'bridge/site-manager-mcp/**'
      - '.github/workflows/mcp-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: site-manager-mcp-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve GHCR image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/site-manager-mcp" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable commit image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./bridge/site-manager-mcp
          file: ./bridge/site-manager-mcp/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

      - name: Record immutable deployment reference
        shell: bash
        run: |
          set -euo pipefail
          image='${{ steps.image.outputs.name }}'
          digest='${{ steps.build.outputs.digest }}'
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $digest" >&2
            exit 1
          fi
          printf '{"commit":"%s","image":"%s","digest":"%s","image_ref":"%s@%s"}\n' \
            "$GITHUB_SHA" "$image" "$digest" "$image" "$digest" > site-manager-mcp-image.json
          cat site-manager-mcp-image.json

      - name: Upload immutable image reference
        uses: actions/upload-artifact@v4
        with:
          name: site-manager-mcp-image-${{ github.sha }}
          path: site-manager-mcp-image.json
          retention-days: 90
