name: Theme Package Disposable WordPress Acceptance

on:
  pull_request:
    paths:
      - 'src/Adapters/WordPress/ThemePackage*.php'
      - 'src/Adapters/WordPress/PluginPackage*.php'
      - 'tests/wordpress_plugin_package_live_acceptance.php'
      - 'scripts/site-manager-host-worker-preflight.php'
      - 'scripts/site_manager_host_preflight.py'
      - 'src/Adapters/WordPress/*DraftCreation*.php'
      - 'src/Adapters/WordPress/*FeaturedImage*.php'
      - 'src/Adapters/WordPress/PublicImageInventory.php'
      - 'src/Adapters/WordPress/*ImageIngress*.php'
      - 'tests/wordpress_image_ingress_live_acceptance.php'
      - 'tests/wordpress_image_ingress_guard_test.php'
      - 'src/Adapters/WordPress/RemoteAccess.php'
      - 'tests/wordpress_featured_image_live_acceptance.php'
      - 'src/Adapters/WordPress/RemoteWriteAccess.php'
      - 'tests/wordpress_draft_creation_live_acceptance.php'
      - 'src/Adapters/WordPress/RemoteThemePackageAccess.php'
      - 'src/Adapters/WordPress/RemotePlanStore.php'
      - 'src/Adapters/WordPress/WordPressAdapter.php'
      - 'wordpress-plugin/site-manager/**'
      - 'tests/wordpress_theme_package_live_acceptance.php'
      - 'tests/fixtures/theme-package-wordpress.compose.yml'
      - '.github/workflows/theme-package-disposable-wordpress.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-wordpress-theme-deploy:
    name: Native WordPress Theme_Upgrader + REST plan/apply/rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: PHP & Composer for official plugin package
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: zip, gd
          coverage: none

      - name: Resolve plugin version
        id: version
        run: |
          VERSION="$(awk -F': ' '/^ \* Version: / {print $2; exit}' wordpress-plugin/site-manager/site-manager.php | tr -d '\r')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build official installable Site Manager plugin
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          composer test
          php -r 'exit(function_exists("imagecreatefromstring") ? 0 : 1);'
          php tests/wordpress_image_ingress_guard_test.php
          bash scripts/build-wordpress-release.sh
          bash scripts/verify-wordpress-release.sh dist/site-manager-${{ steps.version.outputs.version }}.zip

      - name: Start disposable WordPress + MariaDB in staging
        run: |
          set -euo pipefail
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml up -d --wait --wait-timeout 180 database wordpress
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml ps

      - name: Install disposable WordPress and official Site Manager plugin
        run: |
          set -euo pipefail
          test -s dist/site-manager-${{ steps.version.outputs.version }}.zip
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml run --rm -T cli sh -c 'test -r /artifacts/site-manager-${{ steps.version.outputs.version }}.zip && test -w /var/www/html/wp-content && test -w /var/www/html/wp-content/plugins'
          installed=0
          for attempt in $(seq 1 8); do
            if docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml run --rm -T cli wp core install \
                --url="http://localhost:8088" \
                --title="Disposable Theme Package Acceptance" \
                --admin_user=testadmin \
                --admin_password=ci-fixture-admin-password \
                --admin_email=acceptance@example.invalid \
                --skip-email; then
              installed=1
              break
            fi
            sleep 3
          done
          test "$installed" -eq 1
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml run --rm -T cli wp plugin install /artifacts/site-manager-${{ steps.version.outputs.version }}.zip --activate
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml run --rm -T cli wp option update blog_public 0
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml run --rm -T cli wp plugin is-active site-manager

      - name: Execute real WordPress scoped Theme plan, install, verification and rollback
        run: |
          set -euo pipefail
          container="$(docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml ps -q wordpress)"
          test -n "$container"
          docker cp tests/wordpress_theme_package_live_acceptance.php "$container":/tmp/site-manager-theme-live-acceptance.php
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml exec -T --user www-data wordpress php /tmp/site-manager-theme-live-acceptance.php

      - name: Exercise native WordPress post and page draft creation
        run: |
          set -euo pipefail
          container="$(docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml ps -q wordpress)"
          test -n "$container"
          docker cp tests/wordpress_draft_creation_live_acceptance.php "$container":/tmp/site-manager-draft-live-acceptance.php
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml exec -T --user www-data wordpress php /tmp/site-manager-draft-live-acceptance.php

      - name: Exercise native WordPress featured image assignment and rollback
        run: |
          set -euo pipefail
          container="$(docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml ps -q wordpress)"
          test -n "$container"
          docker cp tests/wordpress_featured_image_live_acceptance.php "$container":/tmp/site-manager-featured-image-live-acceptance.php
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml exec -T --user www-data wordpress php /tmp/site-manager-featured-image-live-acceptance.php

      - name: Exercise native verified image creation on an isolated draft
        run: |
          set -euo pipefail
          container="$(docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml ps -q wordpress)"
          test -n "$container"
          docker cp tests/wordpress_image_ingress_live_acceptance.php "$container":/tmp/site-manager-image-ingress-live-acceptance.php
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml exec -T --user www-data wordpress php /tmp/site-manager-image-ingress-live-acceptance.php

      - name: Exercise actual plugin installation and recovery outside the failed plugin
        run: |
          set -euo pipefail
          container="$(docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml ps -q wordpress)"
          docker exec "$container" mkdir -p /tmp/sm-plugin-recovery-worker
          for class in PluginPackageArchiveGuard PluginPackageRecoveryStore PluginPackageInstallEngine; do
            docker cp "src/Adapters/WordPress/$class.php" "$container:/tmp/sm-plugin-recovery-worker/$class.php"
          done
          docker cp tests/wordpress_plugin_package_live_acceptance.php "$container":/tmp/site-manager-plugin-live-acceptance.php
          docker exec --user www-data "$container" php /tmp/site-manager-plugin-live-acceptance.php apply
          if docker exec --user www-data "$container" php /tmp/site-manager-plugin-live-acceptance.php verify > /tmp/sm-broken-plugin.log 2>&1; then
            echo 'Broken candidate unexpectedly booted' >&2
            exit 1
          fi
          grep -q DISPOSABLE_PLUGIN_FATAL_FIXTURE /tmp/sm-broken-plugin.log
          echo DISPOSABLE_WP_PLUGIN_BOOT_FAILURE=PROVEN
          docker exec --user www-data "$container" php /tmp/site-manager-plugin-live-acceptance.php restore
          docker exec --user www-data "$container" php /tmp/site-manager-plugin-live-acceptance.php verify
          docker exec --user www-data "$container" php /tmp/site-manager-plugin-live-acceptance.php apply-healthy
          docker exec --user www-data "$container" php /tmp/site-manager-plugin-live-acceptance.php verify-healthy

      - name: Prove independent host read-only worker against disposable WordPress
        run: |
          set -euo pipefail
          container="$(docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml ps -q wordpress)"
          docker exec "$container" install -d -m 0700 -o www-data -g www-data /tmp/sm-host-preflight
          docker cp scripts/site-manager-host-worker-preflight.php "$container:/tmp/sm-host-preflight/preflight.php"
          docker cp src/Adapters/WordPress/PluginPackageRecoveryStore.php "$container:/tmp/sm-host-preflight/PluginPackageRecoveryStore.php"
          docker exec --user www-data "$container" php -r '
            require "/var/www/html/wp-load.php";
            if (wp_get_environment_type() !== "staging" || get_option("blog_public") !== "0") { exit(1); }
            update_option("home","https://fixture.invalid");
            update_option("siteurl","https://fixture.invalid");
            $config=["wordpress_root"=>"/var/www/html","site"=>"fixture-site","home"=>"https://fixture.invalid/"];
            $dir="/tmp/sm-host-preflight/";
            file_put_contents($dir."config.json",json_encode($config)); chmod($dir."config.json",0600);
            $state=get_option("site_manager_remote_connection");
            echo json_encode(["site"=>"fixture-site","home"=>"https://fixture.invalid/","connection_id"=>$state["connection_id"],"nonce"=>str_repeat("b",64)]);
          ' > /tmp/sm-host-challenge.json
          docker exec -i --user www-data -e SSH_ORIGINAL_COMMAND=site-manager-preflight-v1 "$container" php /tmp/sm-host-preflight/preflight.php < /tmp/sm-host-challenge.json > /tmp/sm-host-receipt.json
          PYTHONPATH=scripts python3 -c 'import json; from site_manager_host_preflight import verify_receipt; r=verify_receipt(json.load(open("/tmp/sm-host-receipt.json")),json.load(open("/tmp/sm-host-challenge.json"))); assert r["independent_access_verified"] and not r["mutation_performed"]; print("DISPOSABLE_WP_INDEPENDENT_HOST_PREFLIGHT=PASSED")'
          if docker exec -i --user www-data -e SSH_ORIGINAL_COMMAND=arbitrary "$container" php /tmp/sm-host-preflight/preflight.php < /tmp/sm-host-challenge.json; then
            echo 'Unexpected arbitrary command acceptance' >&2
            exit 1
          fi

      - name: Capture disposable WordPress failures
        if: failure()
        run: |
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml logs --tail=130 --no-color || true

      - name: Delete isolated WordPress database and filesystem
        if: always()
        run: |
          docker compose -p sm-theme-acceptance -f tests/fixtures/theme-package-wordpress.compose.yml down --volumes --remove-orphans || true
