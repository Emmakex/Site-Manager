name: WordPress Package

on:
  pull_request:
    paths:
      - 'src/**'
      - 'wordpress-plugin/**'
      - 'scripts/build-wordpress-release.sh'
      - 'scripts/verify-wordpress-release.sh'
      - 'composer.json'
      - '.github/workflows/wordpress-package.yml'
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Run contracts
        run: |
          composer install --no-interaction --prefer-dist
          composer test

      - name: Resolve plugin version
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F': ' '/^ \* Version: / {print $2; exit}' wordpress-plugin/site-manager/site-manager.php | tr -d '\r')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build installable WordPress ZIP
        run: bash scripts/build-wordpress-release.sh

      - name: Verify release package
        run: bash scripts/verify-wordpress-release.sh "dist/site-manager-${{ steps.version.outputs.version }}.zip"

      - name: Upload WordPress package
        uses: actions/upload-artifact@v4
        with:
          name: site-manager-wordpress-${{ steps.version.outputs.version }}
          path: |
            dist/site-manager-${{ steps.version.outputs.version }}.zip
            dist/site-manager-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
