name: Emmake Interior Photography Live QA

on:
  pull_request:
    paths:
      - 'scripts/emmake_inner_visuals_live_audit.cjs'
      - '.github/workflows/emmake-inner-visuals-live.yml'
  push:
    branches: [main]
    paths:
      - 'audits/emmake/inner-media/pending/*.json'

permissions:
  contents: read

jobs:
  allowlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/emmake_inner_visuals_live_audit.cjs
      - run: node scripts/emmake_inner_visuals_live_audit.cjs --self-test

  browser:
    if: github.event_name == 'push'
    needs: allowlist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary pinned Chromium
        run: |
          mkdir -p .qa-deps
          npm install --prefix .qa-deps --ignore-scripts --no-audit --no-fund --no-save playwright@1.65.0
          .qa-deps/node_modules/.bin/playwright install chromium
      - name: Verify actual nine interior pages and nine first-party WebP files
        env:
          NODE_PATH: ${{ github.workspace }}/.qa-deps/node_modules
        run: node scripts/emmake_inner_visuals_live_audit.cjs --run-pending
      - name: Preserve screenshots for human visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmake-interior-visual-browser
          path: |
            artifacts/emmake-inner-media/
            audits/emmake/inner-media/results/
          retention-days: 2
          if-no-files-found: warn
      - name: Persist safe JSON report
        if: always()
        run: |
          set -euo pipefail
          test -f audits/emmake/inner-media/results/visual-inner-emmake-20261114-01.json
          git config user.name "site-manager-public-audit[bot]"
          git config user.email "site-manager-public-audit[bot]@users.noreply.github.com"
          git add audits/emmake/inner-media/results/*.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(emmake): record nine interior image browser checks"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 2
            done
          fi
