name: Site Manager Governed Host Update

on:
  push:
    branches: [main]
    paths:
      - 'commands/site-manager-host-update/pending/*.json'

permissions:
  contents: read
  actions: read

jobs:
  update:
    if: github.actor == 'Emmakex' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    environment: site-manager-emmake-produccion
    timeout-minutes: 12
    concurrency:
      group: site-manager-host-emmake-produccion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve one newly added immutable request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff-tree --no-commit-id --name-status -r HEAD^ HEAD -- commands/site-manager-host-update/pending/)
          test "${#files[@]}" = 1
          IFS=$'\t' read -r status path <<< "${files[0]}"
          [[ "$status" == A && "$path" =~ ^commands/site-manager-host-update/pending/host-update-[a-z0-9-]{8,70}\.json$ ]]
          test -f "$path" && test ! -L "$path"
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"
          python3 scripts/site_manager_site_catalog.py check --site emmake-produccion
      - name: Execute one authorized typed host request
        env:
          REQUEST_PATH: ${{ steps.request.outputs.path }}
          GITHUB_TOKEN: ${{ github.token }}
          HOSTINGER_SM_HOST: ${{ secrets.HOSTINGER_SM_HOST }}
          HOSTINGER_SM_USER: ${{ secrets.HOSTINGER_SM_USER }}
          HOSTINGER_SM_PORT: ${{ vars.HOSTINGER_SM_PORT }}
          HOSTINGER_SM_SSH_KEY: ${{ secrets.HOSTINGER_SM_SSH_KEY }}
          HOSTINGER_SM_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SM_SSH_KNOWN_HOSTS }}
          SITE_MANAGER_SITE_ID: ${{ vars.SITE_MANAGER_SITE_ID }}
          SITE_MANAGER_EXPECTED_CONNECTION_ID: ${{ secrets.SITE_MANAGER_EXPECTED_CONNECTION_ID }}
          SITE_MANAGER_EXPECTED_SITE_URL: ${{ vars.SITE_MANAGER_EXPECTED_SITE_URL }}
          SITE_MANAGER_MCP_BASE_URL: ${{ vars.SITE_MANAGER_MCP_BASE_URL }}
          SITE_MANAGER_MCP_TOKEN: ${{ secrets.SITE_MANAGER_MCP_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          : "${HOSTINGER_SM_SSH_KEY:?Dedicated Hostinger key required}"
          : "${HOSTINGER_SM_SSH_KNOWN_HOSTS:?Verified Hostinger host key required}"
          key="$(mktemp)"
          known="$(mktemp)"
          trap 'rm -f "$key" "$known"' EXIT
          printf '%s\n' "$HOSTINGER_SM_SSH_KEY" > "$key"
          printf '%s\n' "$HOSTINGER_SM_SSH_KNOWN_HOSTS" > "$known"
          python3 scripts/site_manager_host_update.py "$REQUEST_PATH" "$key" "$known" "$RUNNER_TEMP/host-update.json"
      - name: Preserve sanitized operation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-manager-host-update-${{ github.run_id }}
          path: ${{ runner.temp }}/host-update.json
          if-no-files-found: warn
          retention-days: 30
