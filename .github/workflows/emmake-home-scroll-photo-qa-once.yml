name: One-time Emmake scrolled photo acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emmake-home-scroll-photo-qa-once.yml'
permissions:
  contents: read
jobs:
  scrolled-photo-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ephemeral pinned Chromium
        run: |
          mkdir -p .photo-qa
          npm install --prefix .photo-qa --ignore-scripts --no-save --no-audit --no-fund playwright@1.65.0
          .photo-qa/node_modules/.bin/playwright install chromium
      - name: Scroll each public section to load lazy photos and capture real viewport result
        env:
          NODE_PATH: ${{ github.workspace }}/.photo-qa/node_modules
        run: |
          node <<'JS'
          const { chromium }=require('playwright');
          (async ()=>{
            const browser=await chromium.launch({headless:true});
            const base='https://emmake.com/nuevaweb/';
            const photos=[
              ['.seo-geo-corporate-insights-visual__image','insights-resultados-analitica.webp'],
              ['.seo-geo-final-cta__image','contact-consultoria-estrategica.webp']
            ];
            const runs=[['desktop',1440,900],['mobile',390,844]];
            for(const [label,width,height] of runs){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1,javaScriptEnabled:true});
              const response=await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
              if(response.status()!==200)throw Error('home_non_200');
              const hero=page.locator('.seo-geo-corporate-hero-visual__image');
              if(width>820){
                await hero.scrollIntoViewIfNeeded();
                await page.waitForFunction(()=>{const e=document.querySelector('.seo-geo-corporate-hero-visual__image');return e&&e.complete&&e.naturalWidth>0;},null,{timeout:15000});
                console.log(label,'HERO_LOADED');
              }else{
                if(await hero.isVisible())throw Error('mobile_hero_should_be_hidden_for_lcp');
                console.log(label,'HERO_TEXT_FIRST');
              }
              for(const [selector,name] of photos){
                const el=page.locator(selector);
                await el.scrollIntoViewIfNeeded({timeout:15000});
                await page.waitForFunction(selector=>{const e=document.querySelector(selector);return e&&e.complete&&e.naturalWidth>0;},selector,{timeout:15000});
                if(!(await el.getAttribute('src')).includes(name))throw Error('wrong_asset_'+name);
                console.log(label,'PHOTO_VISIBLE_AND_LOADED',name);
              }
              const capability=page.locator('.seo-geo-corporate-card--1');
              await capability.scrollIntoViewIfNeeded();
              const background=await capability.evaluate(el=>getComputedStyle(el,'::before').backgroundImage);
              if(!background.includes('capabilities-soluciones-digitales.webp'))throw Error('capabilities_background_absent');
              console.log(label,'CAPABILITY_BACKGROUND_ACTIVE');
              const widthInfo=await page.evaluate(()=>({viewport:innerWidth,body:document.documentElement.scrollWidth}));
              if(widthInfo.body>widthInfo.viewport+4)throw Error('horizontal_overflow');
              await page.evaluate(()=>scrollTo(0,0));
              await page.screenshot({path:'/tmp/emmake-home-'+label+'-photos-after-scroll.png',fullPage:true,animations:'disabled'});
              await page.close();
            }
            await browser.close();
            console.log('EMMAKE_SCROLLED_VISUAL_ACCEPTANCE_PASSED');
          })().catch(e=>{console.error(e.name,e.message);process.exitCode=1});
          JS
      - name: Preserve desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmake-home-photos-scrolled
          path: /tmp/emmake-home-*-photos-after-scroll.png
          retention-days: 2
          if-no-files-found: warn
