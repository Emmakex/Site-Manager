name: One-time Emmake protected Theme release diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emmake-theme-release-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: site-manager-emmake-nuevaweb
    steps:
      - uses: actions/checkout@v4
      - name: Check official GitHub Actions release transport without exposing credentials
        env:
          SITE_MANAGER_THEME_RELEASE_TOKEN: ${{ secrets.SITE_MANAGER_THEME_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          from urllib.error import HTTPError
          sys.path.insert(0, "scripts")
          from site_manager_theme_release_download import _official_url, _github_fetch, ThemeReleaseDownloadError
          from site_manager_theme_release_provenance import verify_release_reference, extract_pinned_theme_zip
          from site_manager_theme_package_gateway import trusted_release_policy
          p = trusted_release_policy("seo-geo-theme")
          token = os.environ.get("SITE_MANAGER_THEME_RELEASE_TOKEN", "")
          sha = "20f363cdc3814dca0527ed2386cf2eb046b0c767"
          run_id = 43625823751
          artifact_id = 14125004965
          digest = "1f695483818ca3dbbc87cf3778c8454c63ac802723fb843f5cb1200112876542"
          print("secret_present:", bool(token))
          if not token:
              raise SystemExit(1)
          def check(label, fn):
              try:
                  result = fn()
              except Exception as exc:
                  cause = exc
                  codes = []
                  while cause is not None:
                      if isinstance(cause, HTTPError):
                          codes.append(cause.code)
                      cause = getattr(cause, "__cause__", None)
                  print(label, "FAILED", type(exc).__name__, str(exc) if isinstance(exc, ThemeReleaseDownloadError) else "unexpected_error", "http_codes", codes)
                  raise SystemExit(1)
              print(label, "OK")
              return result
          run = check("metadata_run", lambda: _github_fetch(_official_url(p,"run",run_id),token,False))
          artifact = check("metadata_artifact", lambda: _github_fetch(_official_url(p,"artifact",artifact_id),token,False))
          check("official_identity", lambda: verify_release_reference(policy=p, run=run, artifact=artifact, expected_commit_sha=sha, expected_run_id=run_id, expected_artifact_id=artifact_id))
          outer = check("download_artifact", lambda: _github_fetch(_official_url(p,"download",artifact_id),token,True))
          check("inner_sha256", lambda: extract_pinned_theme_zip(outer,expected_zip_sha256=digest))
          print("READY_FOR_GOVERNED_PLAN")
          PY
