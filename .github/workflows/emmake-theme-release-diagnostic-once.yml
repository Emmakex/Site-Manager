name: One-time Emmake MCP tool-scope diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emmake-theme-release-diagnostic-once.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: site-manager-emmake-nuevaweb
    steps:
      - uses: actions/checkout@v4
      - name: Inspect registered site MCP tool names without printing credentials
        env:
          SITE_MANAGER_MCP_TOKEN: ${{ secrets.SITE_MANAGER_MCP_TOKEN }}
          SITE_MANAGER_MCP_BASE_URL: ${{ vars.SITE_MANAGER_MCP_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,sys,json
          sys.path.insert(0,"scripts")
          from site_manager_theme_large_mcp import _wire, _decoded, PROTOCOL_VERSION
          url=os.environ["SITE_MANAGER_MCP_BASE_URL"]
          headers={"authorization":"Bearer "+os.environ["SITE_MANAGER_MCP_TOKEN"],
                   "content-type":"application/json","accept":"application/json, text/event-stream"}
          def call(method, request_id=None, params=None, active_headers=None):
              document={"jsonrpc":"2.0","method":method}
              if request_id is not None: document["id"]=request_id
              if params is not None: document["params"]=params
              wire_headers=active_headers or headers
              return _wire(url,wire_headers,json.dumps(document,separators=(",",":")).encode("utf-8"))
          status,response_headers,body=call("initialize",1,
              {"protocolVersion":PROTOCOL_VERSION,"capabilities":{},
               "clientInfo":{"name":"site-manager-readonly-scope-audit","version":"1.0"}})
          result=_decoded(status,response_headers,body,1)
          version=result.get("protocolVersion")
          h={**headers,"mcp-protocol-version":version}
          session=next((v for k,v in response_headers.items() if k.lower()=="mcp-session-id"),None)
          if session is not None:h["mcp-session-id"]=session
          call("notifications/initialized",active_headers=h)
          status,response_headers,body=call("tools/list",3,active_headers=h)
          result=_decoded(status,response_headers,body,3)
          tools=result.get("tools",[])
          names={t.get("name") for t in tools if isinstance(t,dict)}
          for tool in ("site_read","site_theme_package_state","theme_package_plan","theme_package_apply","theme_package_rollback"):
              print("REGISTERED_TOOL",tool,tool in names)
          print("TOTAL_REGISTERED_TOOLS",len(names))
          PY
