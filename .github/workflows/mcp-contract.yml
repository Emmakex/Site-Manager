name: MCP Contract

on:
  pull_request:
    paths:
      - 'bridge/site-manager-mcp/**'
      - 'deployments/site-manager-mcp/**'
      - 'schemas/site-manager-mcp-deployment-v1.schema.json'
      - 'scripts/site-manager-mcp-ovh-deploy.sh'
      - 'scripts/site-manager-mcp-deployment-request.py'
      - '.github/workflows/mcp-contract.yml'
      - '.github/workflows/mcp-image.yml'
      - '.github/workflows/site-manager-mcp-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/site-manager-mcp/**'
      - 'deployments/site-manager-mcp/**'
      - 'schemas/site-manager-mcp-deployment-v1.schema.json'
      - 'scripts/site-manager-mcp-ovh-deploy.sh'
      - 'scripts/site-manager-mcp-deployment-request.py'
      - '.github/workflows/mcp-contract.yml'
      - '.github/workflows/mcp-image.yml'
      - '.github/workflows/site-manager-mcp-deploy.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge/site-manager-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate deployment script syntax
        run: |
          sh -n scripts/configure-persistent.sh
          bash -n ../../scripts/site-manager-mcp-ovh-deploy.sh
          python3 -m py_compile ../../scripts/site-manager-mcp-deployment-request.py
      - name: Validate deployment request guard
        run: python3 ../../scripts/site-manager-mcp-deployment-request.py self-test
      - name: Validate deployment request schema
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('../../schemas/site-manager-mcp-deployment-v1.schema.json').read_text())
          assert schema['additionalProperties'] is False
          assert set(schema['required']) == {'version','deployment_id','site','action','image_ref','requested_by'}
          assert set(schema['properties']['action']['enum']) == {'deploy','rollback'}
          assert set(schema['properties']['requested_by']['enum']) == {'chatgpt','operator'}
          image = schema['properties']['image_ref']['oneOf']
          assert any(item.get('type') == 'null' for item in image)
          assert any('pattern' in item for item in image)
          print('site-manager-mcp-deployment-v1 schema: OK')
          PY
      - name: Validate loopback Compose contract
        run: |
          cp .env.example .env
          chmod 600 .env
          docker compose -f compose.yaml config --quiet
          rm -f .env
      - name: Validate production shared-edge Compose contract
        env:
          SITE_MANAGER_MCP_IMAGE_REF: ghcr.io/emmakex/site-manager-mcp@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SITE_MANAGER_MCP_EDGE_ALIAS: site-manager-mcp-contract-site
          SITE_MANAGER_REST_BASE: https://example.com/wp-json/site-manager/v1/
          SITE_MANAGER_CONNECTION_ID: smc_contract_connection
          SITE_MANAGER_TOKEN: contract-only-placeholder
        run: |
          docker compose --project-name site-manager-mcp-contract-site -f compose.edge.yaml config --quiet
          rendered="$(docker compose --project-name site-manager-mcp-contract-site -f compose.edge.yaml config)"
          if grep -Eq '(^|[[:space:]])ports:' <<<"$rendered"; then
            echo 'Production shared-edge runtime must not publish host ports' >&2
            exit 1
          fi
          if grep -Eq '^name:[[:space:]]+site-manager-mcp-edge' compose.edge.yaml; then
            echo 'Production shared-edge Compose must not hard-code a project name; each site needs an isolated project' >&2
            exit 1
          fi
          grep -Fq 'name: kairoseth-public-edge' <<<"$rendered"
          grep -Fq 'site-manager-mcp-contract-site' <<<"$rendered"
          grep -Fq 'SITE_MANAGER_TOKEN: contract-only-placeholder' <<<"$rendered"
          grep -Fq 'HOST: 0.0.0.0' <<<"$rendered"
          grep -Fq 'PORT: "8787"' <<<"$rendered"
          if grep -Fq 'SITE_MANAGER_BEARER:' <<<"$rendered"; then
            echo 'Legacy SITE_MANAGER_BEARER must not appear in production Compose' >&2
            exit 1
          fi
          if grep -Fq 'SITE_MANAGER_MCP_HOST:' <<<"$rendered" || grep -Fq 'SITE_MANAGER_MCP_PORT:' <<<"$rendered"; then
            echo 'Production Compose must use the runtime HOST/PORT contract from config.ts' >&2
            exit 1
          fi
      - name: Cross-check runtime environment contract
        run: |
          set -euo pipefail
          grep -Fq "required('SITE_MANAGER_REST_BASE'" src/config.ts
          grep -Fq "required('SITE_MANAGER_TOKEN'" src/config.ts
          grep -Fq "required('SITE_MANAGER_CONNECTION_ID'" src/config.ts
          grep -Fq "env.HOST" src/config.ts
          grep -Fq "env.PORT" src/config.ts
          grep -Fq 'SITE_MANAGER_TOKEN:' compose.edge.yaml
          grep -Fq 'HOST: 0.0.0.0' compose.edge.yaml
          grep -Fq 'PORT: 8787' compose.edge.yaml
      - name: Validate automated deployment contract
        run: |
          set -euo pipefail
          workflow='../../.github/workflows/site-manager-mcp-deploy.yml'
          script='../../scripts/site-manager-mcp-ovh-deploy.sh'
          grep -Fq "deployments/site-manager-mcp/pending/*.json" "$workflow"
          grep -Fq 'environment: site-manager-${{ needs.resolve.outputs.site }}' "$workflow"
          grep -Fq 'SITE_MANAGER_MCP_TOKEN: ${{ secrets.SITE_MANAGER_MCP_TOKEN }}' "$workflow"
          grep -Fq 'site-manager-mcp-deployment-request.py guard' "$workflow"
          grep -Fq 'REPLAY_DECISION == '\''replay_success'\''' "$workflow"
          grep -Fq 'StrictHostKeyChecking=yes' "$workflow"
          grep -Fq 'Run canonical public site.read acceptance' "$workflow"
          grep -Fq 'Roll back automatically when public acceptance fails' "$workflow"
          grep -Fq 'Persist sanitized deployment result for ChatGPT readback' "$workflow"
          grep -Fq 'site-manager-mcp-deploy[bot]' "$workflow"
          grep -Fq -- '--project-name "$PROJECT_NAME"' "$script"
          grep -Fq 'rollback restored empty baseline' "$script"
          grep -Fq 'SITE_MANAGER_TOKEN=[0-9a-f]{64}' "$script"
      - name: Build container
        run: docker build -t site-manager-mcp:contract .
