name: MCP Contract

on:
  pull_request:
    paths:
      - 'bridge/site-manager-mcp/**'
      - '.github/workflows/mcp-contract.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/site-manager-mcp/**'
      - '.github/workflows/mcp-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge/site-manager-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate persistent deployment scripts
        run: sh -n scripts/configure-persistent.sh
      - name: Validate Compose contract
        run: |
          cp .env.example .env
          chmod 600 .env
          docker compose -f compose.yaml config --quiet
          rm -f .env
      - name: Build container
        run: docker build -t site-manager-mcp:contract .
