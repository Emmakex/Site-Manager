name: Emmake About Interior Visual Structure
on:
  pull_request:
    paths:
      - 'scripts/site_manager_emmake_about_visual.cjs'
      - '.github/workflows/emmake-about-visual.yml'
permissions:
  contents: read
jobs:
  read-only-about:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed public-only target
        run: |
          node --check scripts/site_manager_emmake_about_visual.cjs
          grep -Fq "const ORIGIN='https://emmake.com/nuevaweb/'" scripts/site_manager_emmake_about_visual.cjs
          grep -Fq "const ROUTE='sobre-nosotros/'" scripts/site_manager_emmake_about_visual.cjs
      - name: Install ephemeral Chromium
        run: |
          npm install --prefix .qa-deps --no-save --ignore-scripts --no-audit --no-fund playwright@1.65.0
          .qa-deps/node_modules/.bin/playwright install chromium
      - name: Inspect published About page on desktop and mobile
        env:
          NODE_PATH: ${{ github.workspace }}/.qa-deps/node_modules
        run: node scripts/site_manager_emmake_about_visual.cjs
      - name: Upload short-lived public-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmake-about-visual-prechange
          path: artifacts/emmake-about-visual/
          retention-days: 2
          if-no-files-found: error
