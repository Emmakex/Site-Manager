name: Site Manager Command Gateway Quality

on:
  pull_request:
    paths:
      - '.github/workflows/site-manager-command-gateway*.yml'
      - '.github/workflows/site-manager-site-bootstrap.yml'
      - 'commands/site-manager/**'
      - 'config/site-manager-command-registry.json'
      - 'config/site-manager-site-catalog.json'
      - 'schemas/site-manager-command-v1.schema.json'
      - 'scripts/site-manager-command-*.py'
      - 'scripts/site_manager_site_overview.py'
      - 'scripts/site_manager_content_targets.py'
      - 'scripts/site_manager_theme_model.py'
      - 'scripts/site_manager_theme_release_download.py'
      - 'tests/site_manager_theme_release_downloader_test.py'
      - 'scripts/site_manager_site_catalog.py'
      - 'scripts/site_manager_site_bootstrap.py'
      - 'tests/site_manager_command_gateway_test.py'
      - 'tests/site_manager_site_catalog_test.py'
      - 'tests/site_manager_site_bootstrap_test.py'
      - 'tests/site_manager_overview_test.py'
      - 'tests/site_manager_content_targets_test.py'
      - 'tests/site_manager_theme_model_test.py'
      - 'tests/site_manager_theme_bootstrap_gateway_test.py'
      - 'docs/COMMAND_GATEWAY.md'
      - 'docs/SITE_CATALOG.md'
      - 'docs/SITE_ONBOARDING.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-manager-command-gateway*.yml'
      - '.github/workflows/site-manager-site-bootstrap.yml'
      - 'commands/site-manager/**'
      - 'config/site-manager-command-registry.json'
      - 'config/site-manager-site-catalog.json'
      - 'schemas/site-manager-command-v1.schema.json'
      - 'scripts/site-manager-command-*.py'
      - 'scripts/site_manager_site_overview.py'
      - 'scripts/site_manager_content_targets.py'
      - 'scripts/site_manager_theme_model.py'
      - 'scripts/site_manager_theme_release_download.py'
      - 'tests/site_manager_theme_release_downloader_test.py'
      - 'scripts/site_manager_site_catalog.py'
      - 'scripts/site_manager_site_bootstrap.py'
      - 'tests/site_manager_command_gateway_test.py'
      - 'tests/site_manager_site_catalog_test.py'
      - 'tests/site_manager_site_bootstrap_test.py'
      - 'tests/site_manager_overview_test.py'
      - 'tests/site_manager_content_targets_test.py'
      - 'tests/site_manager_theme_model_test.py'
      - 'tests/site_manager_theme_bootstrap_gateway_test.py'
      - 'docs/COMMAND_GATEWAY.md'
      - 'docs/SITE_CATALOG.md'
      - 'docs/SITE_ONBOARDING.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runner self-test
        run: python3 scripts/site-manager-command-runner.py --self-test

      - name: Replay guard self-test
        run: python3 scripts/site-manager-command-guard.py self-test

      - name: Gateway static contract
        run: python3 tests/site_manager_command_gateway_test.py

      - name: Official Theme release fetch safety
        run: python3 tests/site_manager_theme_release_downloader_test.py

      - name: Theme first-time adoption Gateway safety
        run: python3 tests/site_manager_theme_bootstrap_gateway_test.py

      - name: Site overview read-only operator contract
        run: python3 tests/site_manager_overview_test.py

      - name: Published content target discovery and data exclusion contract
        run: python3 tests/site_manager_content_targets_test.py

      - name: Theme semantic model read-only integration and exclusion
        run: python3 tests/site_manager_theme_model_test.py

      - name: Verified site catalog and cross-tenant isolation
        run: |
          python3 tests/site_manager_site_catalog_test.py
          python3 scripts/site_manager_site_catalog.py list
          python3 scripts/site_manager_site_catalog.py check --site emmake-nuevaweb

      - name: Protected read-only site bootstrap contract
        run: python3 tests/site_manager_site_bootstrap_test.py

      - name: Python syntax contract
        run: python3 -m py_compile scripts/site-manager-command-runner.py scripts/site-manager-command-guard.py scripts/site_manager_site_overview.py scripts/site_manager_content_targets.py scripts/site_manager_theme_model.py scripts/site_manager_site_catalog.py scripts/site_manager_site_bootstrap.py tests/site_manager_command_gateway_test.py tests/site_manager_overview_test.py tests/site_manager_content_targets_test.py tests/site_manager_theme_model_test.py tests/site_manager_theme_bootstrap_gateway_test.py tests/site_manager_site_catalog_test.py tests/site_manager_site_bootstrap_test.py
