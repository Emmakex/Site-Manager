name: Emmake Published Pages SEO Metadata Audit

on:
  pull_request:
    paths:
      - 'scripts/site_manager_emmake_public_seo_audit.cjs'
      - 'scripts/site_manager_emmake_production_seo_audit.cjs'
      - 'scripts/emmake_final_production_browser.cjs'
      - '.github/workflows/emmake-public-seo-audit.yml'

permissions:
  contents: read

jobs:
  public-seo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fixed-site read-only HTML parser contract
        run: node scripts/site_manager_emmake_public_seo_audit.cjs --self-test
      - name: Inspect 11 published URLs without exporting page text
        run: node scripts/site_manager_emmake_public_seo_audit.cjs --run
      - name: Preserve only bounded SEO counts/status
        uses: actions/upload-artifact@v4
        with:
          name: emmake-public-seo-11-pages
          path: artifacts/emmake-seo/public-pages-seo.json
          retention-days: 7
          if-no-files-found: error

  production-seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed-origin production contract
        run: node scripts/site_manager_emmake_production_seo_audit.cjs --self-test
      - name: Read public production SEO and discovery outputs
        run: node scripts/site_manager_emmake_production_seo_audit.cjs --run
      - name: Preserve bounded production evidence
        uses: actions/upload-artifact@v4
        with:
          name: emmake-production-public-seo
          path: artifacts/emmake-seo/production-public-seo.json
          retention-days: 7
          if-no-files-found: error
      - name: Run final desktop and mobile production QA
        run: |
          mkdir -p .qa-deps
          npm install --prefix .qa-deps --ignore-scripts --no-save --no-audit --no-fund playwright@1.65.0
          .qa-deps/node_modules/.bin/playwright install chromium
          NODE_PATH="$PWD/.qa-deps/node_modules" node scripts/emmake_final_production_browser.cjs
      - name: Preserve final public browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emmake-final-production-browser
          path: artifacts/emmake-final-browser/
          retention-days: 7
          if-no-files-found: warn
